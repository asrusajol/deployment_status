{% set selected_client = filter_clients | selectattr("id", "equalto", selected_client_id) | first %}
<form method="get" action="{{ filter_action }}" class="filter-bar">
  <div class="filter-field">
    <label for="client_name_filter">Client</label>
    <!-- Type-to-search, same pattern as the Task ID field on the request form
         (request_form.html) — a free-text input suggesting from a <datalist>, resolved
         to the real client_id via the JS below (matched by exact name), rather than a
         plain <select> the user has to scroll through. Clearing the text (or typing
         something that matches no client) submits client_id="" — same "All clients" as
         before. -->
    <input
      type="text"
      id="client_name_filter"
      list="filter_clients_list"
      autocomplete="off"
      placeholder="All clients"
      value="{{ selected_client.name if selected_client else '' }}"
    >
    <datalist id="filter_clients_list">
      {% for c in filter_clients %}
        <option data-id="{{ c.id }}" value="{{ c.name }}"></option>
      {% endfor %}
    </datalist>
    <input type="hidden" name="client_id" id="client_id" value="{{ selected_client_id or '' }}">
  </div>
  {% if show_system_filter | default(true) %}
  <div class="filter-field">
    <label for="environment">System</label>
    <select name="environment" id="environment">
      <option value="">All systems</option>
      {% for env in filter_environments %}
        <option value="{{ env.value }}" {% if selected_environment == env %}selected{% endif %}>{{ env.value | capitalize }}</option>
      {% endfor %}
    </select>
  </div>
  {% endif %}
  {% if show_task_id_filter | default(true) %}
  <div class="filter-field">
    <label for="task_id">Task ID</label>
    <input type="text" name="task_id" id="task_id" value="{{ selected_task_id }}" placeholder="Search Task ID">
  </div>
  {% endif %}
  <button type="submit" class="button-primary">Filter</button>
  <a href="{{ filter_action }}" class="button-secondary">Reset</a>
  <a
    href="{{ export_action }}?client_id={{ selected_client_id or '' }}{% if show_system_filter | default(true) %}&environment={{ selected_environment.value if selected_environment else '' }}{% endif %}{% if show_task_id_filter | default(true) %}&task_id={{ selected_task_id | urlencode }}{% endif %}"
    class="button-secondary"
  >Export to Excel</a>
</form>

<script>
  (function () {
    var textInput = document.getElementById("client_name_filter");
    var hiddenInput = document.getElementById("client_id");
    var options = document.querySelectorAll("#filter_clients_list option");

    textInput.addEventListener("input", function () {
      var typed = textInput.value;
      var match = null;
      options.forEach(function (opt) {
        if (opt.value === typed) match = opt;
      });
      // No exact match yet (still mid-typing, or a name that doesn't exist) — same as
      // an empty box, submits as "All clients" rather than a stale/wrong id.
      hiddenInput.value = match ? match.getAttribute("data-id") : "";
    });
  })();
</script>
