<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Deployment Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D1113'/%3E%3Crect x='4' y='19' width='7' height='9' rx='1.5' fill='%23E8A33D'/%3E%3Crect x='13' y='11' width='7' height='17' rx='1.5' fill='%233FC7B8'/%3E%3Crect x='22' y='3' width='7' height='25' rx='1.5' fill='%234CC98A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="auth-page">
    <form method="post" action="/login" class="form auth-form">
      <div class="auth-lockup">
        <svg width="26" height="26" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="1" y="12" width="5" height="7" rx="1" fill="#E8A33D"/>
          <rect x="7.5" y="6.5" width="5" height="12.5" rx="1" fill="#3FC7B8"/>
          <rect x="14" y="1" width="5" height="18" rx="1" fill="#4CC98A"/>
        </svg>
        <span style="font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; color: var(--paper); letter-spacing: -0.01em;">Deployment Tracker</span>
      </div>
      <h1>Sign in to continue</h1>
      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
