# Reverse proxy for the Deployment Tracker (project_plan.md, "Production deployment" in
# README.md) — terminates TLS and forwards to the app container, which speaks plain HTTP
# on APP_PORT (8010 by default) and has no TLS of its own.
#
# TLS is back here (an earlier version of this file was plain HTTP-only, deliberately,
# since this app is internal-only) because browsers flatly block the Notification
# permission prompt on insecure origins — not just the newer Push API, the plain
# `Notification.requestPermission()` used by /requests' desktop-notification feature.
# Being on a local/internal-only network doesn't exempt an origin from this; browsers
# only check the URL scheme (http: vs https:). See README's "Production deployment".
#
# Generate a self-signed cert first (10-year validity — this is manually trusted per
# browser anyway, see below, so there's no CA-imposed shorter max):
#   sudo mkdir -p /etc/nginx/ssl
#   sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#     -keyout /etc/nginx/ssl/deployment.test.local.key \
#     -out /etc/nginx/ssl/deployment.test.local.crt \
#     -subj "/CN=deployment.test.local" \
#     -addext "subjectAltName=DNS:deployment.test.local"
#
# Install:
#   sudo cp deploy/nginx/deployment.test.local.conf /etc/nginx/sites-available/deployment.test.local
#   sudo ln -s /etc/nginx/sites-available/deployment.test.local /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# There's no CA behind this cert, so every browser will show a "your connection isn't
# private" warning the first time — click through it once per browser/machine (Chrome:
# Advanced -> Proceed to deployment.test.local (unsafe); Firefox: Advanced -> Accept the
# Risk and Continue). That's a one-time step per browser, not per visit.
#
# Also set SESSION_COOKIE_HTTPS_ONLY=true in .env once this is live (app/config.py) so
# the login session cookie gets marked Secure to match.
#
# Adjust `server_name`, the cert paths, and the upstream port (8010) to match your setup
# if you changed APP_PORT from the default.

upstream deployment_tracker {
    server 127.0.0.1:8010;
}

server {
    listen 80;
    listen [::]:80;
    server_name deployment.test.local;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deployment.test.local;

    ssl_certificate     /etc/nginx/ssl/deployment.test.local.crt;
    ssl_certificate_key /etc/nginx/ssl/deployment.test.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    access_log /var/log/nginx/deployment.test.local.access.log;
    error_log  /var/log/nginx/deployment.test.local.error.log;

    # style.css etc. — same upstream, just cached at the edge; nothing behind
    # /static/ ever changes per-request, so this is safe to cache aggressively.
    location /static/ {
        proxy_pass http://deployment_tracker;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://deployment_tracker;
        proxy_http_version 1.1;

        # Host/X-Forwarded-* let the app (and its logs) see the real client and scheme
        # instead of nginx's own loopback connection.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_redirect off;
    }
}
