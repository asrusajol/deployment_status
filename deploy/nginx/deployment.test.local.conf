# Reverse proxy for the Deployment Tracker (project_plan.md, "Production deployment" in
# README.md) — forwards to the app container, which speaks plain HTTP on APP_PORT (8010
# by default). Plain HTTP here too, deliberately: this app is only reachable on the
# internal network, not exposed to the public internet, so TLS termination isn't needed.
#
# Install:
#   sudo cp deploy/nginx/deployment.test.local.conf /etc/nginx/sites-available/deployment.test.local
#   sudo ln -s /etc/nginx/sites-available/deployment.test.local /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust `server_name` and the upstream port (8010) to match your actual APP_PORT if you
# changed it from the default.

upstream deployment_tracker {
    server 127.0.0.1:8010;
}

server {
    listen 80;
    listen [::]:80;
    server_name deployment.test.local;

    client_max_body_size 10m;

    access_log /var/log/nginx/deployment.test.local.access.log;
    error_log  /var/log/nginx/deployment.test.local.error.log;

    # style.css etc. — same upstream, just cached at the edge; nothing behind
    # /static/ ever changes per-request, so this is safe to cache aggressively.
    location /static/ {
        proxy_pass http://deployment_tracker;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://deployment_tracker;
        proxy_http_version 1.1;

        # Host/X-Forwarded-* let the app (and its logs) see the real client instead of
        # nginx's own loopback connection.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_redirect off;
    }
}
